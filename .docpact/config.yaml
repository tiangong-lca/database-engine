        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Direct review-submission admission, retirement of legacy Gate/coordinator surfaces, and the Review Admin quality-diagnostic queue and readback define the database boundary for Worker, Edge API, and UI integration.
  - id: database-engine-sql-tests-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/tests/**
        kind: db-test
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: SQL assertions and offline Node test contracts can alter the minimum proof story for future database and Hosted-runner work.
  - id: database-engine-oauth-client-authorization
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/config.toml
        kind: db-config
      - path: supabase/migrations/*oauth*.sql
        kind: db-schema
      - path: supabase/tests/*oauth*.sql
        kind: db-test
