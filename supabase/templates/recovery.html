<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your TianGong LCA password</title>
  </head>
  <body style="margin: 0; background: #f5f7fa; color: #1f2937; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width: 560px; background: #ffffff; border-radius: 12px"
          >
            <tr>
              <td style="padding: 32px">
                <h1 style="margin: 0 0 16px; font-size: 24px">Reset your password</h1>
                <p style="margin: 0 0 24px; line-height: 1.6">
                  Use the button below to choose a new password for your TianGong LCA account.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="display: inline-block; padding: 12px 20px; border-radius: 8px; background: #1677ff; color: #ffffff; text-decoration: none; font-weight: 600"
                    >Reset password</a
                  >
                </p>
                <p style="margin: 0 0 8px; line-height: 1.6">
                  If the button does not work, copy and paste this same link into your browser:
                </p>
                <p style="margin: 0; overflow-wrap: anywhere; line-height: 1.6">
                  <a href="{{ .ConfirmationURL }}">{{ .ConfirmationURL }}</a>
                </p>
                <p style="margin: 24px 0 0; color: #6b7280; line-height: 1.6">
                  If you did not request a password reset, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
