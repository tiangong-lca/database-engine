        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: OAuth client registration, revocation, RLS, RPC pre-request enforcement, and environment provisioning must retain one database authorization contract and proof path.
  - id: database-engine-schema-workspace-tooling
    scope: repo
    repo: database-engine
    triggers:
