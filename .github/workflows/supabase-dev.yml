name: Supabase Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: supabase-dev
  cancel-in-progress: false

jobs:
  validate-local-contract:
    name: Validate Fresh Local Database Contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python contract dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0" "pglast==8.4" "psycopg[binary]==3.3.2"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.0

      - name: Prefetch pinned PostgREST conformance image
        run: >-
          docker pull
          public.ecr.aws/supabase/postgrest@sha256:8b53afca2e239bc90a0facdb880710232886c38dae5743a57d66056e96d5596a

      - name: Run manifest contract tests
        run: |
          python -m unittest \
            scripts.test_database_contract_manifest \
            scripts.test_issue_407_document_validation_evidence_expand \
            scripts.test_issue_407_document_validation_evidence_physical_expand \
            scripts.test_issue_390_result_api_facade_runtime_unit
          python -m scripts.issue_390_pre_ddl_gate --check

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Run canonical contract
        run: python scripts/run_database_contract.py --suite canonical-local

      - name: Run Issue 407 exact predecessor-to-candidate qualification
        env:
          PGPASSWORD: postgres # gitleaks:allow -- disposable loopback Supabase default
        run: |
          predecessor="$RUNNER_TEMP/issue407-predecessor"
          git worktree add --detach "$predecessor" 06ab3e6b017e732b15d1edd9c7ef8f4a35139187
          python - "$predecessor/supabase/config.toml" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          replacements = {
              'project_id = "database-engine"': 'project_id = "database-engine-407-predecessor"',
              'port = 55321': 'port = 62321',
              'port = 55322': 'port = 62322',
              'shadow_port = 55320': 'shadow_port = 62320',
              'port = 55329': 'port = 62329',
              'port = 55323': 'port = 62323',
              'port = 55324': 'port = 62324',
              'port = 55327': 'port = 62327',
          }
          for source, target in replacements.items():
              if text.count(source) != 1:
                  raise SystemExit(f"unexpected predecessor config occurrence: {source}")
              text = text.replace(source, target)
          path.write_text(text)
          PY
          supabase start --workdir "$predecessor"
          predecessor_system_id="$(psql -X -At --host 127.0.0.1 --port 62322 --username postgres --dbname postgres -c 'select system_identifier from pg_control_system()')"
          candidate_system_id="$(psql -X -At --host 127.0.0.1 --port 55322 --username postgres --dbname postgres -c 'select system_identifier from pg_control_system()')"
          candidate_status="$(supabase status --output json)"
          export ISSUE407_ANON_KEY="$(python -c 'import json,sys; print(json.load(sys.stdin)["ANON_KEY"])' <<<"$candidate_status")"
          export ISSUE407_SERVICE_KEY="$(python -c 'import json,sys; print(json.load(sys.stdin)["SECRET_KEY"])' <<<"$candidate_status")"
          python scripts/test_issue_407_document_validation_evidence_runtime.py \
            --predecessor-db-url postgresql://postgres@127.0.0.1:62322/postgres \
            --candidate-db-url postgresql://postgres@127.0.0.1:55322/postgres \
            --expected-predecessor-system-id "$predecessor_system_id" \
            --expected-candidate-system-id "$candidate_system_id" \
            --expected-predecessor-project-id database-engine-407-predecessor \
            --expected-predecessor-container supabase_db_database-engine-407-predecessor \
            --expected-candidate-project-id database-engine \
            --expected-candidate-container supabase_db_database-engine \
            --execution-mode ci-hard-bound \
            --api-url http://127.0.0.1:55321 \
            --confirm-isolated-destructive-test

      - name: Stop Issue 407 predecessor stack
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/issue407-predecessor/supabase" ]]; then
            supabase stop --workdir "$RUNNER_TEMP/issue407-predecessor" --no-backup
          fi

      - name: Verify Issue 357 artifacts, generated phases, unit contracts, and focused suite
        run: >-
          python scripts/run_database_contract.py
          --suite lca-private-expand
          --if-activated

      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup

  deploy-supabase-dev:
    name: Deploy Supabase Migrations to Dev
    needs: validate-local-contract
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_DEV_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.0

      - name: Link Supabase dev branch
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations to Supabase dev branch
        run: supabase db push --include-all

      - name: Apply allowlisted PostgREST configuration
        run: >-
          python3 scripts/apply_postgrest_config.py
          --project-ref "$SUPABASE_PROJECT_ID"
          --apply

      - name: Read back hosted PostgREST configuration
        run: >-
          python3 scripts/apply_postgrest_config.py
          --project-ref "$SUPABASE_PROJECT_ID"
          --check
