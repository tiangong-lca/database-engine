repo:
  id: database-engine
  owner: database-engine

rules:
  - id: database-engine-bootstrap-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/**
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
      - path: docs/agents/lca-result-gc-contract.md
        kind: deep-doc
      - path: docs/agents/supabase-branching.md
        kind: deep-doc
      - path: docs/agents/supabase-branching_CN.md
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/lca-result-gc-contract.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, and retained source docs must stay aligned.
  - id: database-engine-readme-and-landing-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: README.md
        kind: repo-landing
      - path: README.zh-CN.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
    reason: Repo landing docs should stay aligned with the current repo contract and AI entry surface.
  - id: database-engine-branch-config-and-automation
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/config.toml
        kind: db-config
      - path: .github/workflows/supabase-dev.yml
        kind: automation
      - path: .github/workflows/database-validation.yml
        kind: automation
      - path: .env.supabase.dev.local.example
        kind: operator-template
      - path: .env.supabase.main.local.example
        kind: operator-template
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/supabase-branching.md
        mode: review_or_update
      - path: docs/agents/supabase-branching_CN.md
        mode: review_or_update
    reason: Branch bindings and persistent dev automation change repo routing, proof, and branch-operation guidance together.
  - id: database-engine-hosted-consumer-qualification
    scope: repo
    repo: database-engine
    triggers:
      - path: .github/workflows/lca-snapshot-hosted-qualification.yml
        kind: hosted-proof-automation
      - path: supabase/tests/hosted/lca_snapshot_hosted_qualification.py
        kind: hosted-proof-runner
      - path: supabase/tests/hosted/test_lca_snapshot_hosted_qualification.py
        kind: hosted-proof-test
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/supabase-branching.md
        mode: review_or_update
    reason: The canonical-dev-only secret-bearing hosted proof must keep targeting, credential, cleanup, and source-trust boundaries aligned.
  - id: database-engine-migration-and-seed-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/migrations/**
        kind: db-schema
      - path: supabase/operator/**
        kind: operator-rollback
      - path: supabase/seed.sql
        kind: db-seed
      - path: supabase/seeds/**
        kind: db-seed
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/lca-result-gc-contract.md
        mode: review_or_update
    reason: Schema and seed changes affect authoring routes, source-of-truth boundaries, and minimum proof expectations.
  - id: database-engine-review-submit-gate-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/migrations/*review_submit_gate*.sql
        kind: db-schema
      - path: supabase/migrations/*review_submit_jobs*.sql
        kind: db-schema
      - path: supabase/tests/*review_submit_gate*.sql
        kind: db-test
      - path: supabase/tests/*review_submit_jobs*.sql
        kind: db-test
      - path: supabase/tests/*review_submit_rpc*.sql
        kind: db-test
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Review-submit gate storage and final submit assertions define the database boundary for worker, Edge API, and UI integration.
  - id: database-engine-sql-tests-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/tests/**
        kind: db-test
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/lca-result-gc-contract.md
        mode: review_or_update
    reason: SQL assertions and offline Node test contracts can alter the minimum proof story for future database and Hosted-runner work.
  - id: database-engine-schema-workspace-tooling
    scope: repo
    repo: database-engine
    triggers:
      - path: scripts/**
        kind: tooling
      - path: supabase/workspace/**
        kind: generated-workspace
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/lca-result-gc-contract.md
        mode: review_or_update
      - path: scripts/README.md
        mode: review_or_update
      - path: scripts/README.zh-CN.md
        mode: review_or_update
      - path: supabase/workspace/README.md
        mode: review_or_update
      - path: supabase/workspace/README.zh-CN.md
        mode: review_or_update
    reason: Schema-workspace scripts and generated inspection trees need explicit guidance because some paths are stable and others are disposable.
  - id: database-engine-doc-maintenance-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Repo-local documentation maintenance automation must stay aligned with the repo contract and governed-doc rules.
  - id: database-engine-local-docpact-push-gate
    scope: repo
    repo: database-engine
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.
