  owner: database-engine

rules:
  - id: database-engine-bootstrap-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/**
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
      - path: docs/agents/supabase-branching.md
        kind: deep-doc
      - path: docs/agents/supabase-branching_CN.md
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, and retained source docs must stay aligned.
  - id: database-engine-readme-and-landing-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: README.md
        kind: repo-landing
      - path: README.zh-CN.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
    reason: Repo landing docs should stay aligned with the current repo contract and AI entry surface.
  - id: database-engine-branch-config-and-automation
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/config.toml
        kind: db-config
      - path: supabase/templates/**
        kind: auth-email-template
      - path: .github/workflows/supabase-dev.yml
        kind: automation
      - path: .env.supabase.dev.local.example
        kind: operator-template
      - path: .env.supabase.main.local.example
        kind: operator-template
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/supabase-branching.md
        mode: review_or_update
      - path: docs/agents/supabase-branching_CN.md
        mode: review_or_update
    reason: Branch bindings, isolated PR Preview runtime repair, database-only persistent Dev deployment, and hosted verification change repo routing, proof, and branch-operation guidance together.
  - id: database-engine-migration-and-seed-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/migrations/**
        kind: db-schema
      - path: supabase/seed.sql
        kind: db-seed
      - path: supabase/seeds/**
        kind: db-seed
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Schema and seed changes affect authoring routes, source-of-truth boundaries, and minimum proof expectations.
  - id: database-engine-review-submission-quality-diagnostic-contract
    scope: repo
    repo: database-engine
    triggers:
      - path: supabase/migrations/*review_quality_diagnostic*.sql
        kind: db-schema
      - path: supabase/tests/*review_quality_diagnostic*.sql
        kind: db-test
      - path: supabase/migrations/*review_submit_gate*.sql
        kind: db-schema
      - path: supabase/migrations/*review_submit_jobs*.sql
        kind: db-schema
      - path: supabase/migrations/*review_submit_coordinator*.sql
        kind: db-schema
      - path: supabase/tests/*review_submit_gate*.sql
