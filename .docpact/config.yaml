      - path: supabase/tests/*review_submit_jobs*.sql
        kind: db-test
      - path: supabase/tests/*review_submit_coordinator*.sql
        kind: db-test
      - path: supabase/tests/*review_submit_rpc*.sql
        kind: db-test
    requiredDocs:
